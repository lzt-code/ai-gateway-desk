<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-gateway-desk</title>
<script>
  // 主题首帧预设（置于样式表加载前，避免闪烁）：
  // localStorage('aigd-theme') 手动偏好优先；无偏好时跟随系统 prefers-color-scheme。
  ;(function () {
    var KEY = 'aigd-theme'
    var saved = null
    try { saved = localStorage.getItem(KEY) } catch (e) {}
    var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light' : 'dark'
    document.documentElement.dataset.theme =
      saved === 'light' || saved === 'dark' ? saved : system
  })()
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="app-header">
  <h1>ai-gateway-desk</h1>
  <!-- 应用版本：由 /api/health 返回（健康检查脚本填充），获取失败保持隐藏 -->
  <span id="app-version" class="app-version" hidden></span>
  <nav id="tab-bar">
    <!-- data-view 属性是任务 31-33 的绑定契约 -->
    <button data-view="providers">Provider</button>
    <button data-view="models">模型</button>
    <button data-view="routes">动态路由</button>
    <button data-view="workers">Worker</button>
    <button data-view="account">账户</button>
  </nav>
  <span id="health-status" class="health-status">正在检测后端…</span>
  <!-- 全局加载指示（转圈圈）：所有异步操作（进入视图拉列表 / 保存部署 / 同步 KV /
       部署 Worker 等）由 app.js showBusy/hideBusy 引用计数控制显隐 -->
  <span id="busy-indicator" class="busy-indicator" hidden>
    <span class="busy-spinner" aria-hidden="true"></span>
    <span id="busy-text">处理中…</span>
  </span>
  <!-- 明暗主题手动切换（初始图标由主题脚本填充） -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题"></button>
</header>

<div id="app-main">
  <main id="view-container">
    <!-- 四视图容器：id 约定 view-<name>，hidden 切换（任务 31-33 填充内容） -->
    <section class="view" id="view-providers" hidden></section>
    <section class="view" id="view-models" hidden></section>
    <section class="view" id="view-routes" hidden></section>
    <section class="view" id="view-workers" hidden></section>
    <section class="view" id="view-account" hidden></section>
  </main>
  <aside id="side-panel">
    <div id="hint-bar"></div>
    <!-- 侧栏操作按钮：随当前视图显隐 -->
    <div id="side-actions" hidden>
      <button id="btn-provider-refresh" class="btn btn-default" type="button">更新 Provider 列表</button>
      <button id="btn-provider-add" class="btn btn-default" type="button">添加 Provider</button>
    </div>
    <div id="model-side-actions" class="side-actions" hidden>
      <div class="side-group">
        <div class="side-group-title">数据操作</div>
        <button id="mbtn-sync" class="btn btn-default" type="button">拉取云端数据</button>
        <button id="mbtn-sync-one" class="btn btn-default" type="button" disabled title="请先在左侧选择一个 Provider">拉取当前 Provider</button>
        <button id="mbtn-save-deploy" class="btn btn-primary" type="button">部署更改</button>
        <button id="mbtn-save" class="btn btn-default" type="button">暂存更改<span class="btn-hint">本地暂存，暂不部署</span></button>
      </div>
      <div class="side-group">
        <div class="side-group-title">模型操作</div>
        <button id="mbtn-batch-toggle" class="btn btn-default" type="button">批量切换</button>
        <button id="mbtn-batch-remove" class="btn btn-danger" type="button" disabled title="仅当当前列表全部为手工添加的模型时可用">批量删除</button>
        <button id="mbtn-add" class="btn btn-default" type="button">添加</button>
      </div>
      <div class="side-group">
        <div class="side-group-title">Cloudflare</div>
        <!-- 动态路由（Dynamic Routes）外部入口：新窗口打开。默认指向 AI Gateway
             列表页；app.js 启动拉取账户状态后，按 accountId/gatewayId 精化到
             当前网关的动态路由页（未配置保持回退）。
             只读展示见「动态路由」选项卡（view-routes）；编辑仍在 Cloudflare 后台 -->
        <a id="cf-routes-link" class="btn btn-default side-ext-link"
           href="https://dash.cloudflare.com/?to=/:account/ai/ai-gateway"
           target="_blank" rel="noopener noreferrer"
           title="打开 Cloudflare AI Gateway（登录后选择网关）">动态路由 ↗</a>
      </div>
    </div>
    <div id="routes-side-actions" class="side-actions" hidden>
      <div class="side-group">
        <div class="side-group-title">数据操作</div>
        <button id="rbtn-sync" class="btn btn-default" type="button">拉取云端路由</button>
      </div>
      <div class="side-group">
        <div class="side-group-title">Cloudflare</div>
        <a id="routes-cf-edit-link" class="btn btn-default side-ext-link"
           href="https://dash.cloudflare.com/?to=/:account/ai/ai-gateway"
           target="_blank" rel="noopener noreferrer"
           title="打开 Cloudflare AI Gateway 动态路由页（登录后选择网关）">在 Cloudflare 中编辑路由 ↗</a>
      </div>
    </div>
  </aside>
</div>

<div id="progress-panel" hidden></div>

<!-- 底部处理过程日志栏：所有操作（拉取 Provider / 更新模型列表 / 获取 Worker 状态 /
     更新模型信息 / 保存部署 / 账户操作等）的过程日志统一写入此处 -->
<div id="activity-log">
  <div class="log-bar">
    <span class="log-title">处理过程日志</span>
    <span id="log-count" class="log-count" hidden></span>
    <button id="btn-log-debug" class="log-btn" type="button"
      title="开启后同步模型时输出每个 Provider /models 调用的完整请求与响应：终端打印全文，此处打印脱敏请求头与响应体预览（下次同步生效）">调试日志: 关</button>
    <button id="btn-log-clear" class="log-btn" type="button">清空</button>
    <button id="btn-log-toggle" class="log-btn" type="button">展开全部</button>
  </div>
  <div id="activity-log-body" class="log-body">
    <div class="log-empty">暂无操作记录</div>
  </div>
</div>

<div id="flash-root"></div>

<!-- 阻塞式执行提示：拉取 Provider/模型列表、部署模型更新、部署 Worker 等长耗时任务
     使用独立弹窗遮罩，阻止用户其他操作；不可取消/不可点击遮罩关闭 -->
<div id="blocking-overlay" hidden>
  <div class="blocking-backdrop" aria-hidden="true"></div>
  <div class="blocking-panel" role="dialog" aria-modal="true" aria-label="处理中">
    <span class="blocking-spinner" aria-hidden="true"></span>
    <span id="blocking-text" class="blocking-text">处理中…</span>
  </div>
</div>

<script>
  // 后端健康检查（任务 25 占位逻辑保留，显示在页头右侧）
  ;(async () => {
    const el = document.getElementById('health-status')
    const verEl = document.getElementById('app-version')
    let ok = false
    try {
      const res = await fetch('/api/health')
      const j = await res.json()
      ok = !!(j && j.ok)
      if (verEl && j && j.version) {
        verEl.textContent = 'v' + j.version
        verEl.hidden = false
      }
      el.textContent = ok ? '✓ 后端服务正常' : '✗ 后端异常'
    } catch {
      el.textContent = '✗ 无法连接后端'
    }
    el.classList.toggle('ok', ok)
    el.classList.toggle('bad', !ok)
  })()
</script>

<script>
  // 明暗主题切换：手动切换持久化到 localStorage；系统主题变化仅在
  // 「无手动偏好」时跟随。图标用文本变体符号（☾ / ☀︎），随当前主题切换。
  ;(function () {
    var KEY = 'aigd-theme'
    var rootEl = document.documentElement
    var btn = document.getElementById('theme-toggle')

    function savedTheme() {
      try {
        var v = localStorage.getItem(KEY)
        return v === 'light' || v === 'dark' ? v : null
      } catch (e) { return null }
    }

    function paint() {
      if (!btn) return
      var light = rootEl.dataset.theme === 'light'
      btn.textContent = light ? '\u263E' : '\u2600\uFE0E'
      var title = light ? '切换到深色主题' : '切换到浅色主题'
      btn.title = title
      btn.setAttribute('aria-label', title)
    }

    // 系统主题变化：仅无手动偏好时跟随（有偏好以用户选择为准）
    if (window.matchMedia) {
      var mql = window.matchMedia('(prefers-color-scheme: light)')
      var onChange = function () {
        if (!savedTheme()) {
          rootEl.dataset.theme = mql.matches ? 'light' : 'dark'
          paint()
        }
      }
      if (mql.addEventListener) mql.addEventListener('change', onChange)
      else if (mql.addListener) mql.addListener(onChange)
    }

    if (btn) {
      btn.addEventListener('click', function () {
        var next = rootEl.dataset.theme === 'light' ? 'dark' : 'light'
        try { localStorage.setItem(KEY, next) } catch (e) {}
        rootEl.dataset.theme = next
        paint()
      })
    }
    paint()
  })()
</script>

<script type="module" src="app.js"></script>
</body>
</html>
